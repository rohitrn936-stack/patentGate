[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimbreaker"
version = "0.1.0"
description = "Feature extraction agent for ClaimBreaker"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "openai>=2.0.0",
  "pydantic>=2.0.0",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
